<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TheTechPlaybook – Daily IT, Cloud and AI Carousels</title>
<meta name="description" content="Free daily IT, cloud and AI carousels with step-by-step guides and tested commands. New playbook every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#183C6E;--ink:#F3F7FC;--muted:#C2D0E4;--line:#3D639C;--blue:#3B82F6;--teal:#14B8A6;--amber:#F5B027;--coral:#FB7185;--white:#224C84;--navy:#183C6E;--navy2:#143C73}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.65 "IBM Plex Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",sans-serif;line-height:1.1;margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.top{border-bottom:1px solid #2F5590;background:#102B52;position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;height:68px}
.brand{font:800 24px "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
nav{display:flex;gap:28px;font-size:17px;font-weight:500}
nav a{color:var(--muted);text-decoration:none}
nav a:hover{color:var(--blue)}
.band{background:radial-gradient(circle at 88% 15%,rgba(245,176,39,.28),transparent 42%),linear-gradient(120deg,#1E40AF 0%,#0E7490 100%);color:#fff}
.band.connect{background:radial-gradient(circle at 10% 90%,rgba(20,184,166,.3),transparent 45%),linear-gradient(120deg,#5B21B6 0%,#1E40AF 100%)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:56px;align-items:center;padding:80px 24px}
.hero h1{font-size:clamp(44px,7vw,80px);font-weight:800;letter-spacing:-.025em}
.hero p{max-width:44ch;color:#C9D6E8;font-size:21px;margin:22px 0 32px}
.btn{display:inline-block;border:0;border-radius:8px;padding:14px 24px;font:500 17px "IBM Plex Sans",sans-serif;background:var(--blue);color:#fff;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.gold{background:var(--amber);color:var(--navy);font-weight:600}
.btn.alt{background:var(--white);color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{border-color:var(--blue)}
.latest{cursor:pointer;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;position:relative}
.latest .cover{box-shadow:14px 14px 0 var(--amber)}
.latest small{display:block;margin-top:26px;color:#C9D6E8;font-size:16px}
.cover{aspect-ratio:4/5;width:100%;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;position:relative}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover b{font:800 clamp(20px,2.4vw,28px)/1.1 "Bricolage Grotesque",sans-serif;position:relative}
.cover span{position:relative;font-size:15px;opacity:.9;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
section{padding:56px 0}
section>h2,.about h2{font-size:clamp(30px,4vw,42px);font-weight:800;letter-spacing:-.015em}
.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:24px 0 32px}
.tools input{color:var(--ink);flex:1 1 260px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:17px;background:var(--white)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:99px;padding:9px 18px;font:inherit;font-size:16px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--blue)}
.chip[aria-pressed=true]{background:var(--teal);color:#06302B;border-color:var(--teal);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px}
.card{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.card h3{font-size:21px;margin:16px 0 6px}
.card p{margin:0;color:var(--muted);font-size:16px}
.card:hover h3{color:var(--amber)}
.card:hover .cover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(0,0,0,.4)}
.cover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.tools input::placeholder{color:var(--muted)}
.band{border-bottom:1px solid rgba(255,255,255,.12)}
.cover{transition:transform .15s,box-shadow .15s}
.cover .ico{position:absolute;top:18px;right:18px;font-size:46px;font-style:normal;line-height:1}
.cover:not(.real)::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,255,255,.25),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px)}
.cover.real{padding:0;background:#fff!important}
.empty{color:var(--muted);padding:30px 0}
.about{display:grid;grid-template-columns:1fr 1.4fr;gap:56px;border-top:1px solid var(--line)}
section>h2::after,.about h2::after{content:"";display:block;width:56px;height:4px;border-radius:2px;margin-top:12px;background:linear-gradient(90deg,var(--amber),var(--coral))}
.about>div:last-child{border-left:4px solid var(--teal);padding-left:28px}
.about p{color:var(--muted);max-width:62ch;font-size:19px;margin:0 0 16px}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.links .btn{display:inline-flex;align-items:center;gap:10px}
.lead{color:#C9D6E8;font-size:19px;margin:12px 0 0}
footer{background:#0F2748;color:#C2D0E4;padding:26px 0;font-size:16px}
dialog{border:0;border-radius:10px;padding:0;width:min(940px,94vw);height:min(90vh,840px);background:#fff;color:#0B1F3A}
dialog .btn.alt{background:#fff;color:#0B1F3A;border:1px solid #DAE2EC}
dialog::backdrop{background:rgba(11,31,58,.7)}
.dh{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #DAE2EC}
.dh h3{font-size:20px}
.da{display:flex;gap:8px}
.da .btn{padding:10px 16px;font-size:16px}
dialog iframe{width:100%;height:calc(100% - 70px);border:0}
@media(max-width:760px){body{font-size:17px}.hero,.about{grid-template-columns:1fr;gap:32px}.hero{padding:44px 24px}nav{display:none}.latest .cover{box-shadow:9px 9px 0 var(--amber)}.hero p{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#" id="brand"></a>
  <nav><a href="#library">Carousels</a><a href="#about">About</a><a href="#connect">Connect</a></nav>
</div></header>

<main>
<div class="band"><div class="wrap hero">
  <div>
    <h1 id="heroName"></h1>
    <p id="heroTag"></p>
    <a class="btn gold" href="#library">Browse all carousels</a>
  </div>
  <button class="latest" id="latest" aria-label="Open the latest carousel"></button>
</div></div>

<div class="wrap">
<section id="library">
  <h2>Daily carousels</h2>
  <div class="tools">
    <input id="q" type="search" placeholder="Search by title or topic" aria-label="Search carousels">
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No carousels match. Try another topic or clear the search.</p>
</section>

<section class="about" id="about">
  <div><h2>About</h2></div>
  <div id="aboutText"></div>
</section>

</div>
<div class="band connect"><div class="wrap">
<section id="connect">
  <h2>Connect</h2>
  <p class="lead">Follow for a new playbook every day.</p>
  <div class="links" id="links"></div>
</section>
</div></div>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh">
    <h3 id="dt"></h3>
    <div class="da">
      <a class="btn" id="dl" download>Download PDF</a>
      <button class="btn alt" id="close">Close</button>
    </div>
  </div>
  <iframe id="frame" title="Carousel PDF"></iframe>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
/* ===== EDIT THIS BLOCK ONLY ===== */
const CONFIG = {
  name: "TheTechPlaybook",
  tagline: "Daily IT, cloud and AI playbooks. One carousel every day, free to read and download.",
  about: [
    "TheTechPlaybook is a growing library of daily carousels for IT professionals, developers and trainees. Every day, one topic is turned into a clear, step-by-step guide covering Linux, Cloud, Git, DevOps, troubleshooting and AI. Each guide includes tested commands and real examples, so you can follow along on your own system. Read it online or download the PDF for free.",
    "The goal is simple: make practical tech knowledge easy to learn, one slide at a time."
  ],
  links: [
    {label: "LinkedIn", url: "https://www.linkedin.com/in/suneel-kumar-eng/"},
    {label: "Facebook", url: "https://www.facebook.com/vCloudGuru/"},
    {label: "Telegram", url: "https://t.me/vCloudguru"},
    {label: "YouTube", url: "https://www.youtube.com/@vcloudguru"}
  ]
};
/* ================================= */

const ICONS = {
  LinkedIn: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect width="24" height="24" rx="4" fill="#0A66C2"/><text x="12" y="17" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#fff">in</text></svg>',
  Facebook: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1877F2"/><text x="13.5" y="19.5" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#fff">f</text></svg>',
  Telegram: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#26A5E4"/><polygon points="5,11.8 18.5,6.2 16,18.2 11.6,14.8 9.4,17 9.4,13.6 16,8.6 8.2,13" fill="#fff"/></svg>',
  YouTube: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="1" y="4.5" width="22" height="15" rx="4.5" fill="#FF0000"/><polygon points="10,8.8 16,12 10,15.2" fill="#fff"/></svg>'
};
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const EMOJI = {"Security":"🛡️","Azure":"☁️","Microsoft 365":"📧","Active Directory":"🗂️","Hyper-V":"🖥️","Networking":"🌐","AI":"🤖","Windows Server":"🪟","PowerShell":"⚡","IT Tips":"💡"};
const thumbs = new Map();
const COLORS = ["#2563EB","#0D9488","#7C3AED","#DB2777","#EA580C","#0891B2"];
const $ = id => document.getElementById(id);
let items = [], topic = "All";

function colorFor(t){let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%COLORS.length;return COLORS[h]}
function fmt(d){return new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function thumb(c){
  if (!thumbs.has(c.pdf)) {
    thumbs.set(c.pdf, (async () => {
      const pdf = await pdfjsLib.getDocument(c.pdf).promise;
      const page = await pdf.getPage(1);
      const v1 = page.getViewport({scale: 1});
      const vp = page.getViewport({scale: 560 / v1.width});
      const cv = document.createElement("canvas");
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
      return {url: cv.toDataURL("image/jpeg", 0.88), ratio: vp.width / vp.height};
    })());
  }
  return thumbs.get(c.pdf);
}
function cover(c){
  const d = document.createElement("div");
  d.className = "cover";
  d.style.background = "linear-gradient(160deg," + colorFor(c.topic) + ",#0B1F3A)";
  const em = document.createElement("i"); em.className = "ico"; em.textContent = EMOJI[c.topic] || "💡";
  const s = document.createElement("span"); s.textContent = c.topic;
  const b = document.createElement("b"); b.textContent = c.title;
  d.append(em, s, b);
  const show = (url, ratio) => {
    const i = document.createElement("img"); i.src = url; i.alt = c.title + " - first slide";
    d.replaceChildren(i); d.classList.add("real");
    if (ratio) d.style.aspectRatio = String(ratio);
  };
  if (c.thumb) show(c.thumb);
  else if (window.pdfjsLib) thumb(c).then(t => show(t.url, t.ratio)).catch(() => {});
  return d;
}
function open(c){
  $("dt").textContent = c.title;
  $("dl").href = c.pdf;
  $("frame").src = c.pdf + "#view=FitH";
  $("dlg").showModal();
}
function card(c){
  const b = document.createElement("button");
  b.className = "card";
  b.append(cover(c));
  const h = document.createElement("h3"); h.textContent = c.title;
  const p = document.createElement("p"); p.textContent = fmt(c.date) + " · " + c.topic;
  b.append(h, p);
  b.onclick = () => open(c);
  return b;
}
function render(){
  const q = $("q").value.trim().toLowerCase();
  const list = items.filter(c => (topic==="All"||c.topic===topic) && (c.title+" "+c.topic+" "+(c.summary||"")).toLowerCase().includes(q));
  $("grid").replaceChildren(...list.map(card));
  $("empty").hidden = list.length > 0;
}
function chips(){
  const topics = ["All", ...new Set(items.map(c=>c.topic))];
  $("chips").replaceChildren(...topics.map(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t; b.setAttribute("aria-pressed", t===topic);
    b.onclick = () => { topic = t; chips(); render(); };
    return b;
  }));
}
function init(){
  document.title = CONFIG.name + " – Daily IT, Cloud and AI Carousels";
  $("brand").textContent = CONFIG.name;
  $("heroName").textContent = CONFIG.name;
  $("heroTag").textContent = CONFIG.tagline;
  $("aboutText").replaceChildren(...CONFIG.about.map(t => { const p = document.createElement("p"); p.textContent = t; return p; }));
  $("links").replaceChildren(...CONFIG.links.filter(l => l.url && l.url !== "#").map(l => {
    const a = document.createElement("a"); a.className = "btn alt"; a.href = l.url; a.target = "_blank"; a.rel = "noopener"; a.innerHTML = (ICONS[l.label] || "") + "<span></span>"; a.querySelector("span").textContent = l.label; return a;
  }));
  $("foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name + ". New carousel published every day.";
  $("q").oninput = render;
  $("close").onclick = () => $("dlg").close();
  $("dlg").addEventListener("close", () => { $("frame").src = "about:blank"; });
}
async function load(){
  init();
  try {
    const r = await fetch("carousels.json?v=" + Date.now());
    items = await r.json();
  } catch (e) {
    $("grid").textContent = "Could not load carousels.json. Open this site through GitHub Pages or a local server, not by double-clicking the file.";
    return;
  }
  if (!items.length) {
    $("latest").hidden = true;
    $("grid").textContent = "The first carousel will appear here after the next daily run.";
    return;
  }
  items.sort((a,b) => b.date.localeCompare(a.date));
  if (items.length) {
    const l = items[0];
    $("latest").replaceChildren(cover(l));
    const s = document.createElement("small"); s.textContent = "Latest · " + fmt(l.date); $("latest").appendChild(s);
    $("latest").onclick = () => open(l);
  }
  chips(); render();
}
load();
</script>
</body>
</html>
